# Go to workspace #
bind = $modifier, 1, workspace, 1
bind = $modifier, 2, workspace, 2
bind = $modifier, 3, workspace, 3
bind = $modifier, 4, workspace, 4
bind = $modifier, 5, workspace, 5
bind = $modifier, 6, workspace, 6
bind = $modifier, 7, workspace, 7
bind = $modifier, 8, workspace, 8
bind = $modifier, 9, workspace, 9
bind = $modifier, 0, workspace, 10
# Go to workspace group #
# bind = Ctrl+$modifier, 1, workspace, 1
# bind = Ctrl+$modifier, 2, workspace, 2
# bind = Ctrl+$modifier, 3, workspace, 3
# bind = Ctrl+$modifier, 4, workspace, 4
# bind = Ctrl+$modifier, 5, workspace, 5
# bind = Ctrl+$modifier, 6, workspace, 6
# bind = Ctrl+$modifier, 7, workspace, 7
# bind = Ctrl+$modifier, 8, workspace, 8
# bind = Ctrl+$modifier, 9, workspace, 9
# bind = Ctrl+$modifier, 0, workspace, 10
# Go to workspace -1/+1
bind = $modifier, mouse_down, workspace, -1
bind = $modifier, mouse_up, workspace, +1
binde = Ctrl+$modifier, left, workspace, -1
binde = $modifier, Page_Up, workspace, -1
binde = Ctrl+$modifier, right, workspace, +1
binde = $modifier, Page_Down, workspace, +1
# Go to workspace group -1/+1
bind = Ctrl+$modifier, mouse_down, workspace, -10
bind = Ctrl+$modifier, mouse_up, workspace, +10
# Toggle special workspace
bind = $modifier, S, exec, caelestia toggle specialws

# Move window to workspace #
bind = $modifier+Shift, 1, movetoworkspace, 1
bind = $modifier+Shift, 2, movetoworkspace, 2
bind = $modifier+Shift, 3, movetoworkspace, 3
bind = $modifier+Shift, 4, movetoworkspace, 4
bind = $modifier+Shift, 5, movetoworkspace, 5
bind = $modifier+Shift, 6, movetoworkspace, 6
bind = $modifier+Shift, 7, movetoworkspace, 7
bind = $modifier+Shift, 8, movetoworkspace, 8
bind = $modifier+Shift, 9, movetoworkspace, 9
bind = $modifier+Shift, 0, movetoworkspace, 10
# Move window to workspace group #
# bind = Ctrl+$modifier+Shift, 1, movetoworkspace, 1
# bind = Ctrl+$modifier+Shift, 2, movetoworkspace, 2
# bind = Ctrl+$modifier+Shift, 3, movetoworkspace, 3
# bind = Ctrl+$modifier+Shift, 4, movetoworkspace, 4
# bind = Ctrl+$modifier+Shift, 5, movetoworkspace, 5
# bind = Ctrl+$modifier+Shift, 6, movetoworkspace, 6
# bind = Ctrl+$modifier+Shift, 7, movetoworkspace, 7
# bind = Ctrl+$modifier+Shift, 8, movetoworkspace, 8
# bind = Ctrl+$modifier+Shift, 9, movetoworkspace, 9
# bind = Ctrl+$modifier+Shift, 0, movetoworkspace, 10
# Move window to workspace -1/+1
binde = $modifier+Alt, Page_Up, movetoworkspace, -1
binde = $modifier+Alt, Page_Down, movetoworkspace, +1
bind = $modifier+Alt, mouse_down, movetoworkspace, -1
bind = $modifier+Alt, mouse_up, movetoworkspace, +1
binde = Ctrl+$modifier+Shift, right, movetoworkspace, +1
binde = Ctrl+$modifier+Shift, left, movetoworkspace, -1
# Move window to/from special workspace
bind = Ctrl+$modifier+Shift, up, movetoworkspace, special:special
bind = Ctrl+$modifier+Shift, down, movetoworkspace, e+0
bind = $modifier+Alt, S, movetoworkspace, special:special

# Window groups
binde = Alt, Tab, cyclenext, activewindow
binde = Ctrl+Alt, Tab, changegroupactive, f
bind = $modifier, Comma, togglegroup
bind = $modifier+Shift, Comma, lockactivegroup, toggle

# Window actions
bind = $modifier, left, movefocus, l
bind = $modifier, right, movefocus, r
bind = $modifier, up, movefocus, u
bind = $modifier, down, movefocus, d
bind = $modifier+Shift, left, movewindow, l
bind = $modifier+Shift, right, movewindow, r
bind = $modifier+Shift, up, movewindow, u
bind = $modifier+Shift, down, movewindow, d
binde = $modifier, Minus, splitratio, -0.1
binde = $modifier, Equal, splitratio, 0.1
bindm = $modifier, mouse:272, movewindow
bindm = $modifier, Z, movewindow
bindm = $modifier, mouse:273, resizewindow
bindm = $modifier, X, resizewindow
bind = Ctrl+$modifier, Backslash, centerwindow, 1
bind = Ctrl+$modifier+Alt, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+$modifier+Alt, Backslash, centerwindow, 1
#bind = $modifier+Alt, Backslash, exec, caelestia pip  # Move window to picture-in-picture mode
bind = $modifier, P, pin
bind = $modifier, F, fullscreen, 0
bind = $modifier+Alt, F, fullscreen, 1  # Fullscreen with borders
bind = $modifier+Alt, Space, togglefloating,
#bind = $modifier, Q, killactive,
bind = Alt, F4, killactive,

# Special workspace toggles
# bind = Ctrl+Shift, Escape, exec, caelestia toggle sysmon
bind = $modifier, M, togglespecialworkspace, music
bind = $modifier Shift, M, movetoworkspace, special:music
bind = $modifier, D, togglespecialworkspace, comms
bind = $modifier Shift, D, movetoworkspace, special:comms
bind = Ctrl+Shift, Escape, togglespecialworkspace, sysmon
bind = ctrl+Shift, Escape, exec, fish ~/.config/hypr/scripts/sysmon.fish
#bind = $modifier, R, exec, caelestia toggle todo

# Apps
bind = $modifier, T, exec, app2unit -- $terminal
bind = $modifier, W, exec, app2unit -- $browser
bind = Ctrl+Alt, Escape, exec, app2unit -- qps
bind = Ctrl+Alt, V, exec, app2unit -- pavucontrol

# Utilities
# bindl = , Print, exec, caelestia screenshot  # Full screen capture > clipboard
bind = $modifier+Shift, S, exec, grim -g "$(slurp)" - | swappy -f -  # Capture region (freeze)
# bind = $modifier+Shift+Alt, S, global, caelestia:screenshot  # Capture region
# bind = $modifier+Alt, R, exec, caelestia record -s  # Record screen with sound
# bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
# bind = $modifier+Shift+Alt, R, exec, caelestia record -r  # Record region
bind = $modifier+Shift, C, exec, hyprpicker -a  # Colour picker
bind = $modifier+Shift, E, exit

# Volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $modifier+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Sleep
bind = $modifier+Shift, L, exec, systemctl suspend-then-hibernate

# Clipboard and emoji picker
# bind = $modifier, V, exec, pkill fuzzel || caelestia clipboard
# bind = $modifier+Alt, V, exec, pkill fuzzel || caelestia clipboard -d
# bind = $modifier, Period, exec, pkill fuzzel || caelestia emoji -p
# bindl = Ctrl+Shift+Alt, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"  # Alternate paste
#
# Testing
bindl = $modifier+Alt, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"
