exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = killall -q swaync;sleep .5 && swaync
#exec-once = nm-applet --indicator
exec-once = qbittorrent-nox
exec-once = lxqt-policykit-agent
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = ~/.local/share/caelestia/shell/run.fish

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 5
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = scrolling
}
input {
    kb_layout = $keyboardLayout
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = no
    }

    sensitivity = -0.15 # -1.0 - 1.0, 0 means no modification.
}
windowrule = decorate off, match:class ^(wofi)$
windowrule = center on, match:class ^(wofi)$
#windowrule = center,class:^(steam)$
windowrule = float on, match:class (nm-connection-editor|blueman-manager)
#windowrule = stayfocused, title:^()$,class:^(steam)$
#windowrule = minsize 1 1, title:^()$,class:^(steam)$

windowrule = float on, match:class ^(${browser})$, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:class ^(${browser})$, match:title ^(Picture-in-Picture)$, match:float true
windowrule = suppress_event fullscreen, match:class ^(${browser})$, match:title ^(Picture-in-Picture)$
windowrule = suppress_event maximize, match:class ^(${browser})$, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:class ^(${browser})$, match:title ^(Picture-in-Picture)$

windowrule = float on, match:class ^(nm-connection-editor)$, match:title ^(Network Connections)$
windowrule = move 69.5% 4%, match:class ^(nm-connection-editor)$, match:title ^(Network Connections)$
windowrule = size 30% 30%, match:class ^(nm-connection-editor)$, match:title ^(Network Connections)$
windowrule = rounding 0, match:class ^(nm-connection-editor)$, match:title ^(Network Connections)$
windowrule = pin on, match:class ^(nm-connection-editor)$, match:title ^(Network Connections)$

windowrule = suppress_event fullscreen, match:class ^(org.kde.dolphin)$

windowrule = float on, match:class ^(org.kde.plasmawindowed)$, match:title ^(Calendar)$
windowrule = move 32.5% 4%, match:class ^(org.kde.plasmawindowed)$, match:title ^(Calendar)$
windowrule = size 35% 40%, match:class ^(org.kde.plasmawindowed)$, match:title ^(Calendar)$
windowrule = rounding 0, match:class ^(org.kde.plasmawindowed)$, match:title ^(Calendar)$

gesture = 3, vertical, workspace


#           animations {
#   enabled = yes


#   bezier = myBezier, 0.05, 0.9, 0.1, 1.05

#   animation = windows, 1, 7, myBezier
#   animation = windowsOut, 1, 7, default, popin 80%
#   animation = border, 1, 10, default
#   animation = fade, 1, 7, default
#   animation = workspaces, 1, 6, default
#           }
animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1
    bezier = winIn, 0.1, 1, 0.1, 1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind
    animation = windowsIn, 1, 6, winIn
    animation = windowsOut, 1, 5, winOut
    animation = windowsMove, 1, 5, wind
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind, slidevert
}


decoration {
    rounding = 15
    blur {
        enabled = true
        size = 8
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}


dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    new_status = master
}

scrolling {

}
